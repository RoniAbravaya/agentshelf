# Railway (Nixpacks) build for the AgentShelf monorepo. pnpm comes from the packageManager field via corepack.
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["corepack enable", "corepack prepare pnpm@12.16.1 --activate", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @agentshelf/web build"]

[start]
cmd = "pnpm --filter @agentshelf/core db:migrate && pnpm --filter @agentshelf/web start"
